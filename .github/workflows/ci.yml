name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-and-test:
    name: Build and test (Windows)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Workflow linting runs in the Linux gate-coverage job below, not here: actionlint's
      # shellcheck pass stalled on windows-latest (2026-09-24, 589 s against a usual ~25 s,
      # tripping this job's 10-minute timeout) on the canonical review-tier.yml.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet csharpier check .
      - name: Select package version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $packageVersion = '1.0.0'
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
              throw 'Release tags must use vMAJOR.MINOR.PATCH.'
            }
            $packageVersion = $env:REF_NAME.Substring(1)
          }
          "PACKAGE_VERSION=$packageVersion" >> $env:GITHUB_ENV
      - run: dotnet restore FixPortal.FixAtdl.Wpf.slnx
      - run: dotnet build FixPortal.FixAtdl.Wpf.slnx -c Release --no-restore "-p:Version=$env:PACKAGE_VERSION"
      - id: test
        run: dotnet test --solution FixPortal.FixAtdl.Wpf.slnx -c Release --no-build --report-xunit-trx --results-directory ./TestResults --timeout 5m
      - name: Collect Core branch coverage
        # Audit 2026-09-15 Section 7 (H1): first coverage measurement on Wpf.Core
        # only, via dotnet-coverage wrapping the unchanged test command (the
        # fixportal-fixatdl pattern).
        run: dotnet dotnet-coverage collect -f cobertura -o ./TestResults/coverage-core.cobertura.xml "dotnet test --project tests/FixPortal.FixAtdl.Wpf.Core.Tests --configuration Release --no-build --timeout 5m"
      - name: Enforce Core coverage floors
        shell: pwsh
        run: |
          [xml]$coverage = Get-Content ./TestResults/coverage-core.cobertura.xml
          $product = $coverage.coverage.packages.package | Where-Object name -eq 'FixPortal.FixAtdl.Wpf.Core'
          if (-not $product) { throw 'Core product coverage package is missing.' }
          $lineRate = [double]$product.'line-rate'
          $branchRate = [double]$product.'branch-rate'
          if ($lineRate -lt 0.90) { throw "Core line coverage $lineRate is below 0.90." }
          if ($branchRate -lt 0.85) { throw "Core branch coverage $branchRate is below 0.85." }
      - name: Collect WPF coverage
        run: dotnet dotnet-coverage collect -f cobertura -o ./TestResults/coverage-ui.cobertura.xml "dotnet test --project tests/FixPortal.FixAtdl.Wpf.Tests.UI --configuration Release --no-build --timeout 5m"
      - name: Enforce WPF coverage floors
        shell: pwsh
        run: |
          [xml]$coverage = Get-Content ./TestResults/coverage-ui.cobertura.xml
          $product = $coverage.coverage.packages.package | Where-Object name -eq 'FixPortal.FixAtdl.Wpf'
          if (-not $product) { throw 'WPF product coverage package is missing.' }
          $lineRate = [double]$product.'line-rate'
          $branchRate = [double]$product.'branch-rate'
          if ($lineRate -lt 0.90) { throw "WPF line coverage $lineRate is below 0.90." }
          if ($branchRate -lt 0.75) { throw "WPF branch coverage $branchRate is below 0.75." }
      - run: dotnet pack src/FixPortal.FixAtdl.Wpf.Core -c Release --no-build -o artifacts "-p:Version=$env:PACKAGE_VERSION"
      - run: dotnet pack src/FixPortal.FixAtdl.Wpf -c Release --no-build -o artifacts "-p:Version=$env:PACKAGE_VERSION"
      - name: Validate package contents
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression

          function Get-ZipEntryBytes([System.IO.Compression.ZipArchive]$zip, [string]$name) {
              $entry = $zip.GetEntry($name)
              if ($null -eq $entry) { throw "nupkg entry '$name' not found" }
              $ms = New-Object System.IO.MemoryStream
              $stream = $entry.Open()
              try { $stream.CopyTo($ms) } finally { $stream.Dispose() }
              # The comma suppresses PowerShell's pipeline unrolling of the byte array.
              return ,$ms.ToArray()
          }

          function Test-PackagePayload([string]$packagePath, [string[]]$requiredResources) {
              $zip = [System.IO.Compression.ZipArchive]::new([System.IO.File]::OpenRead($packagePath), 'Read')
              try {
                  $dllEntries = @($zip.Entries | ForEach-Object FullName | Where-Object { $_ -match '^lib/[^/]+/[^/]+\.dll$' })
                  if ($dllEntries.Count -ne 1) { throw "expected exactly one lib/<tfm>/*.dll entry in $packagePath, found $($dllEntries.Count)" }
                  $dllEntry = $dllEntries[0]
                  if ($requiredResources.Count -eq 0) {
                      Write-Output "OK $(Split-Path -Leaf $packagePath): $dllEntry present"
                      return
                  }
                  # Load without dependency resolution; manifest resource enumeration is metadata-only.
                  $asm = [System.Reflection.Assembly]::Load((Get-ZipEntryBytes $zip $dllEntry))
                  $blob = $asm.GetManifestResourceNames() | Where-Object { $_ -match '\.g\.resources$' } | Select-Object -First 1
                  if (-not $blob) { throw "'.g.resources' blob missing from $dllEntry" }
                  $reader = New-Object System.Resources.ResourceReader($asm.GetManifestResourceStream($blob))
                  try { $keys = @{}; foreach ($entry in $reader) { $keys[$entry.Key] = $true } } finally { $reader.Dispose() }
                  foreach ($required in $requiredResources) {
                      if (-not ($keys.Keys | Where-Object { $_ -ieq $required })) {
                          throw "resource '$required' missing from $dllEntry (have: $($keys.Keys -join ', '))"
                      }
                      Write-Output "OK $(Split-Path -Leaf $packagePath): $required"
                  }
              } finally { $zip.Dispose() }
          }

          $core = Get-ChildItem 'artifacts/FixPortal.FixAtdl.Wpf.Core.*.nupkg' | Select-Object -First 1
          $wpf = Get-ChildItem 'artifacts/FixPortal.FixAtdl.Wpf.[0-9]*.nupkg' | Select-Object -First 1
          if (-not $core) { throw 'FixPortal.FixAtdl.Wpf.Core nupkg missing' }
          if (-not $wpf) { throw 'FixPortal.FixAtdl.Wpf nupkg missing' }

          # Core carries no WPF payload; the WPF package must embed the component
          # resource dictionary and generic theme that standalone hosting resolves
          # through the assembly (audit 2026-09-15 Section 7, G6).
          Test-PackagePayload $core.FullName @()
          Test-PackagePayload $wpf.FullName @('themes/generic.baml', 'fixatdlwpfresources.baml')
      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/*.nupkg
          if-no-files-found: error
      - name: Upload test results
        if: always() && steps.test.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: ./TestResults/*.trx
          if-no-files-found: error
      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-results
          path: ./TestResults/*.cobertura.xml
          if-no-files-found: warn

  gate-coverage:
    name: Gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true
      - name: Assert every quality job is gated
        env:
          GATE_EXEMPT: publish
        run: python3 .github/scripts/assert_gate_coverage.py .github/workflows/ci.yml

      - name: Assert canonical asset copies match the committed manifest
        run: python3 .github/scripts/assert_canonical_assets.py

      - name: Assert release eligibility gate
        run: python3 .github/scripts/assert_release_eligibility.py

  ci-gate:
    name: CI Gate
    if: always()
    needs: [build-and-test, gate-coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any upstream job did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  publish:
    name: Publish Packages (GitHub Packages + NuGet.org)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-and-test, ci-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Lint workflows
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true
      - name: Require a tag reachable from main
        run: git merge-base --is-ancestor "${GITHUB_SHA}^{commit}" origin/main
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v8
        with:
          name: packages
          path: artifacts
      # `dotnet nuget push` reads NUGET_API_KEY when --api-key is absent, so the key
      # never enters the argument vector, which ps/process listings on the runner
      # would otherwise expose; environment variables are not shown there.
      - name: Publish validated packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet nuget push 'artifacts/*.nupkg' --source https://nuget.pkg.github.com/FixPortal/index.json --skip-duplicate

      # NuGet.org exchanges this job's GitHub OIDC token for a one-hour, single-use
      # API key. `user` is the policy creator; package ownership remains FixPortal.
      - name: NuGet.org login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: chris-fixportal

      - name: Publish validated packages to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'artifacts/*.nupkg' --source https://api.nuget.org/v3/index.json --skip-duplicate
