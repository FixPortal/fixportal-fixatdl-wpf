name: mutation

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 4'

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # Restore only the project Stryker mutates. The solution also holds the WPF projects
      # (net10.0-windows), which fail restore on this Linux runner with NETSDK1100; Core and
      # Core.Tests target plain net10.0.
      - name: Restore mutation test project
        run: dotnet restore tests/FixPortal.FixAtdl.Wpf.Core.Tests/FixPortal.FixAtdl.Wpf.Core.Tests.csproj
      - name: Restore local tools
        run: dotnet tool restore
      - name: Run Stryker
        working-directory: tests/FixPortal.FixAtdl.Wpf.Core.Tests
        run: dotnet stryker --config-file ../../stryker-config.json
      - name: Summarize mutation report
        if: always()
        shell: pwsh
        run: |
          $latest = Get-ChildItem tests/FixPortal.FixAtdl.Wpf.Core.Tests/StrykerOutput -Directory | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latest) { throw "No StrykerOutput directory found." }
          $report = Join-Path $latest.FullName 'reports/mutation-report.json'
          $jsonSummary = Join-Path $latest.FullName 'reports/mutation-summary.json'
          $mdSummary = Join-Path $latest.FullName 'reports/mutation-summary.md'
          .\scripts\summarize-stryker.ps1 -ReportPath $report -JsonOutputPath $jsonSummary -MarkdownOutputPath $mdSummary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - name: Upload mutation summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-summary
          path: tests/FixPortal.FixAtdl.Wpf.Core.Tests/StrykerOutput/**/reports/mutation-summary.*
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: tests/FixPortal.FixAtdl.Wpf.Core.Tests/StrykerOutput/**
          if-no-files-found: error
