<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      --color-ink:     #1f2937;

      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
      body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      }
    .frame { max-width: 1600px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1200px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · FixPortal.FixAtdl.Wpf</p>
    <h1>Creating and reading back a panel</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="panelseq-title panelseq-desc">
      <title id="panelseq-title">Creating and reading back a panel</title>
      <desc id="panelseq-desc">AtdlPanel.Create asks the renderer to generate XAML, which WPF parses into a FrameworkElement, and builds an EditViewModel; the host then edits, checks HasErrors, and reads the 957 to 960 tag sequence back from the view-model, which delegates to the headless core emitter.</desc>

        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6b85"/></marker>

        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f8fa"/>

      <!-- ===== WPF LIBRARY BOUNDARY ===== -->

      <rect x="216" y="24" width="112" height="16" rx="2" fill="#f7f8fa"/>
      <text x="272" y="35" fill="#047857" font-size="8" font-weight="600" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">WPF LIBRARY</text>

      <!-- ===== LIFELINES ===== -->

      <line x1="488" y1="96" x2="488" y2="470" stroke="rgba(31,41,55,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="688" y1="96" x2="688" y2="470" stroke="rgba(31,41,55,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="872" y1="96" x2="872" y2="470" stroke="rgba(31,41,55,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- ===== ACTIVATION BARS ===== -->
      <rect x="284" y="140" width="8" height="160" fill="rgba(31,41,55,0.06)" stroke="#5b6b85" stroke-width="0.8"/>

      <!-- ===== MESSAGES ===== -->
      <!-- 1 -->

      <text x="192" y="129" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">Create(strategy, sp)</text>

      <!-- 2 -->
      <line x1="296" y1="172" x2="480" y2="172" stroke="#5b6b85" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- 3 -->

      <text x="780" y="193" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">XamlReader.Parse</text>

      <!-- 4 return -->
      <line x1="864" y1="236" x2="496" y2="236" stroke="#5b6b85" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

      <!-- 6 return -->

      <rect x="140" y="280" width="104" height="12" rx="2" fill="#f7f8fa"/>
      <text x="192" y="289" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">(view, editor)</text>

      <!-- 7 -->

      <rect x="336" y="312" width="104" height="12" rx="2" fill="#f7f8fa"/>

      <rect x="140" y="344" width="104" height="12" rx="2" fill="#f7f8fa"/>
      <text x="192" y="353" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">HasErrors: false</text>

      <rect x="302" y="376" width="172" height="12" rx="2" fill="#f7f8fa"/>
      <text x="388" y="385" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">ReadBackStrategyParametersGrp()</text>

      <!-- ===== ACTORS ===== -->
      <rect x="40" y="48" width="112" height="48" rx="6" fill="#f7f8fa"/>

      <rect x="216" y="48" width="144" height="48" rx="6" fill="#f7f8fa"/>
      <rect x="216" y="48" width="144" height="48" rx="6" fill="rgba(16,185,129,0.14)" stroke="#047857" stroke-width="1"/>
      <text x="288" y="72" fill="#065f46" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">AtdlPanel</text>
      <text x="288" y="86" fill="#047857" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FixAtdl.Wpf</text>

      <rect x="392" y="48" width="192" height="48" rx="6" fill="#f7f8fa"/>
      <rect x="392" y="48" width="192" height="48" rx="6" fill="rgba(16,185,129,0.14)" stroke="#047857" stroke-width="1"/>
      <text x="488" y="72" fill="#065f46" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">StrategyPanelRenderer</text>
      <text x="488" y="86" fill="#047857" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FixAtdl.Wpf</text>

      <rect x="608" y="48" width="160" height="48" rx="6" fill="#f7f8fa"/>
      <rect x="608" y="48" width="160" height="48" rx="6" fill="rgba(37,99,235,0.12)" stroke="#2563eb" stroke-width="1"/>
      <text x="688" y="72" fill="#1d4ed8" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">EditViewModel</text>
      <text x="688" y="86" fill="#2563eb" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">FixAtdl.Wpf.Core</text>

      <rect x="804" y="48" width="136" height="48" rx="6" fill="#f7f8fa"/>
      <rect x="804" y="48" width="136" height="48" rx="6" fill="rgba(124,58,237,0.12)" stroke="#7c3aed" stroke-width="1"/>
      <text x="872" y="72" fill="#6d28d9" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">WPF platform</text>
      <text x="872" y="86" fill="#7c3aed" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">XamlReader</text>

      <!-- ===== LEGEND ===== -->
      <line x1="40" y1="516" x2="920" y2="516" stroke="rgba(31,41,55,0.10)" stroke-width="0.8"/>
      <text x="40" y="536" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <line x1="124" y1="532" x2="156" y2="532" stroke="#5b6b85" stroke-width="1.2"/>

      <line x1="228" y1="532" x2="260" y2="532" stroke="#5b6b85" stroke-width="1" stroke-dasharray="5,4"/>

      <line x1="348" y1="532" x2="380" y2="532" stroke="#0f766e" stroke-width="1.2"/>

      <text x="612" y="536" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace">HOLDS CONTROL</text>

      <rect x="720" y="527" width="12" height="10" rx="2" fill="rgba(31,41,55,0.03)" stroke="rgba(31,41,55,0.30)" stroke-width="1"/>
      <text x="740" y="536" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace">PLATFORM</text>

      <rect x="820" y="524" width="12" height="12" rx="2" fill="rgba(16,185,129,0.14)" stroke="#047857" stroke-width="1"/>
      <text x="840" y="536" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace">WPF LIBRARY</text>
    </svg>
  </div>
