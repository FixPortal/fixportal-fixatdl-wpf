<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Two packages, two target frameworks</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f7f8fa;
      --color-ink:     #1f2937;
      --color-muted:   #5b6b85;
      --color-accent:  #0f766e;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · FixPortal.FixAtdl.Wpf</p>
    <h1>Two packages, two target frameworks</h1>

    <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pkgsplit-title pkgsplit-desc">
      <title id="pkgsplit-title">Two packages, two target frameworks</title>
      <desc id="pkgsplit-desc">A WPF host stacks on the windows-targeted Wpf package, which sits on the framework-agnostic Wpf.Core view-model package and the headless core library; a host that only wants validation and FIX read-back can depend on Wpf.Core directly and skip WPF entirely.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5b6b85"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0f766e"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2563eb"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f7f8fa"/>

      <!-- ===== ARROWS ===== -->
      <line x1="480" y1="112" x2="480" y2="168" stroke="#5b6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="492" y="128" width="72" height="12" rx="2" fill="#f7f8fa"/>
      <text x="528" y="137" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PACKAGEREF</text>

      <line x1="480" y1="240" x2="480" y2="296" stroke="#5b6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="492" y="256" width="72" height="12" rx="2" fill="#f7f8fa"/>
      <text x="528" y="265" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">VIEW-MODELS</text>

      <line x1="480" y1="368" x2="480" y2="424" stroke="#5b6b85" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="492" y="384" width="68" height="12" rx="2" fill="#f7f8fa"/>
      <text x="526" y="393" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">STRATEGY_T</text>

      <!-- headless bypass: host -> Wpf.Core, skipping the WPF package -->
      <path d="M 600,84 H 720 Q 728,84 728,92 V 324 Q 728,332 720,332 H 600" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="744" y="196" width="128" height="12" rx="2" fill="#f7f8fa"/>
      <text x="808" y="205" fill="#6b7280" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">VALIDATION ONLY, NO WPF</text>

      <!-- ===== NODES ===== -->
      <!-- N1 host -->
      <rect x="360" y="56" width="240" height="56" rx="6" fill="#f7f8fa"/>
      <rect x="360" y="56" width="240" height="56" rx="6" fill="rgba(91,107,133,0.10)" stroke="#6b7280" stroke-width="1"/>
      <rect x="368" y="64" width="36" height="12" rx="2" fill="transparent" stroke="rgba(107,114,128,0.40)" stroke-width="0.8"/>
      <text x="386" y="73" fill="rgba(107,114,128,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HOST</text>
      <text x="480" y="92" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Your WPF application</text>
      <text x="480" y="106" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">net10.0-windows, UseWPF</text>

      <!-- N2 Wpf -->
      <rect x="360" y="168" width="240" height="72" rx="6" fill="#f7f8fa"/>
      <rect x="360" y="168" width="240" height="72" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <rect x="368" y="176" width="44" height="12" rx="2" fill="transparent" stroke="rgba(31,41,55,0.40)" stroke-width="0.8"/>
      <text x="390" y="185" fill="rgba(31,41,55,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NUGET</text>
      <text x="480" y="204" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FixPortal.FixAtdl.Wpf</text>
      <text x="480" y="220" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">net10.0-windows</text>
      <text x="480" y="232" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">AtdlPanel, 15 renderers, XAML</text>

      <!-- N3 Wpf.Core (FOCAL) -->
      <rect x="360" y="296" width="240" height="72" rx="6" fill="#f7f8fa"/>
      <rect x="360" y="296" width="240" height="72" rx="6" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
      <rect x="368" y="304" width="44" height="12" rx="2" fill="transparent" stroke="rgba(15,118,110,0.40)" stroke-width="0.8"/>
      <text x="390" y="313" fill="rgba(15,118,110,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NUGET</text>
      <text x="480" y="332" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FixPortal.FixAtdl.Wpf.Core</text>
      <text x="480" y="348" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">net10.0 &mdash; no WPF dependency</text>
      <text x="480" y="360" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">EditViewModel, ReadBack*</text>

      <!-- N4 core -->
      <rect x="360" y="424" width="240" height="64" rx="6" fill="#f7f8fa"/>
      <rect x="360" y="424" width="240" height="64" rx="6" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <rect x="368" y="432" width="44" height="12" rx="2" fill="transparent" stroke="rgba(31,41,55,0.40)" stroke-width="0.8"/>
      <text x="390" y="441" fill="rgba(31,41,55,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NUGET</text>
      <text x="480" y="464" fill="#1f2937" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">FixPortal.FixAtdl</text>
      <text x="480" y="480" fill="#5b6b85" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">net10.0 &mdash; parse, model, emit</text>

      <!-- ===== LEGEND ===== -->
      <line x1="40" y1="532" x2="920" y2="532" stroke="rgba(31,41,55,0.10)" stroke-width="0.8"/>
      <text x="40" y="552" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="124" y="543" width="12" height="10" rx="2" fill="rgba(15,118,110,0.08)" stroke="#0f766e" stroke-width="1"/>
      <text x="144" y="552" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace">USABLE WITHOUT WPF</text>

      <rect x="332" y="543" width="12" height="10" rx="2" fill="#ffffff" stroke="#1f2937" stroke-width="1"/>
      <text x="352" y="552" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace">PUBLISHED PACKAGE</text>

      <line x1="524" y1="548" x2="556" y2="548" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="564" y="552" fill="#5b6b85" font-size="8" font-family="'Geist Mono', monospace">OPTIONAL HEADLESS PATH</text>
    </svg>
  </div>
</body>
</html>
